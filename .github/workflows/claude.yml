name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed so Claude can commit/push generated components
      pull-requests: write   # needed so Claude can open/update PRs
      issues: write          # needed so Claude can comment back on issues
      id-token: write
      actions: read          # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start dev servers
        run: |
          npm run dev:all > /tmp/dev.log 2>&1 &
          npx wait-on http://localhost:3000 http://localhost:6006 --timeout 120000

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          claude_args: |
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["@playwright/mcp@latest","--headless"]}}}'
            --allowedTools "mcp__playwright__*,Bash(npm run test),Bash(npm run lint),Bash(npm run build-storybook),Edit,Replace"
            --system-prompt "The project is already set up: dependencies are installed and the dev servers are running. The Next.js app is at http://localhost:3000 and Storybook is at http://localhost:6006. Do NOT reinstall dependencies or start the servers yourself. Use the Playwright MCP tools to verify rendered components, preferring the Storybook URL when checking a component in isolation. Run 'npm run test' and 'npm run lint' to validate your work before finishing."